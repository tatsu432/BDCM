[project]
name = "bdcm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "omegaconf>=2.3.0",
    "pytest>=9.0.2",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.8",
    "types-tqdm>=4.67",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bdcm = ["conf/**/*.yaml", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: trains models and writes results (slower than unit tests)",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Keep CI focused on correctness; extend with "I", "UP" locally if you want isort/pyupgrade.
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
show_error_codes = true
# Third-party without stubs or partial stubs
[[tool.mypy.overrides]]
module = [
    "hydra.*",
    "matplotlib.*",
    "omegaconf.*",
    "torch.*",
]
ignore_missing_imports = true
